name: Test OpenWrt Zapret

on:
  push:
    paths:
      - 'routercare-openwrt/**'
      - '.github/workflows/test-routercare.yml'
  pull_request:
    paths:
      - 'routercare-openwrt/**'
      - '.github/workflows/test-routercare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run local regression tests
        run: python3 routercare-openwrt/tests/test_routercare.py
